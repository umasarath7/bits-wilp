<!doctype html>
<html><head><meta charset="utf-8"><title>Figure gallery</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;max-width:1300px;margin:auto} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px} h3{font-size:13px;margin:0 0 4px}</style>
</head><body><div id="g" class="grid"></div>
<script type="module">
import { figures } from "../figures.js";
const g = document.getElementById("g");
const only = new URLSearchParams(location.search).get("p");
for (const [k, v] of Object.entries(figures)) {
  if (only && !k.startsWith(only)) continue;
  g.insertAdjacentHTML("beforeend", `<div><h3>${k}</h3><figure class="figure">${v.svg}<figcaption>${v.caption}</figcaption></figure></div>`);
}
</script></body></html>
